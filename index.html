<!DOCTYPE html>
<html = style="height: 100%;">
  <head>
    <title>The Bes(t) Empire</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scripts/leaflet.css">
    <script src="scripts/leaflet.js"></script>
  </head>
  
  <body style="height: 100%;margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #29333f;"></div>
    <script type="text/javascript">
  //Creating the Map
    var map = L.map('map').setView([0, 0], 0);
L.tileLayer('map/{z}/{x}/{y}.png', {
      continuousWorld: false,
      noWrap: true,  
      minZoom: 1.5,
      maxZoom: 5,
    }).addTo(map);
   //Markers
  var trakyton = L.marker([-10.919618, -18.457031]).bindPopup('Trakyton').addTo(map)
  var solas = L.marker([-12.811801, -6.152344]).bindPopup('Solas').addTo(map)
  var aspar = L.marker([5.266008, 0.703125]).bindPopup('Aspar').addTo(map)
  var eldham = L.marker([-24.926295, -22.412109]).bindPopup('Eldham').addTo(map)
  var gritta = L.marker([-15.961329, 0.966797]).bindPopup('Gritta').addTo(map)  
    </script>
  </body>
</html>

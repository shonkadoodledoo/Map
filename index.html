<!DOCTYPE html>
<html = style="height: 100%;">
  <head>
    <title>The Bes(t) Empire</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scripts/leaflet.css">
    <script src="scripts/leaflet.js"></script>
  </head>
  
  <body style="height: 100%;margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #29333f;"></div>
    <script type="text/javascript">
  //Creating the Map
    var map = L.map('map').setView([0, 0], 0);
L.tileLayer('map/{z}/{x}/{y}.png', {
      continuousWorld: false,
      noWrap: true,  
      minZoom: 1,
      maxZoom: 4,
    }).addTo(map);
  //Coordinate Finder
    
  //Markers
   var trakyton = L.marker([-16.467695, -23.4676]).bindPopup('Trakyton').addTo(map)
  var solas = L.marker([-18.229351, -8.178622]).bindPopup('Solas').addTo(map)
  var aspar = L.marker([6.227934, 0.608949]).bindPopup('Aspar').addTo(map)
  var eldham = L.marker([-33.849978, -30.57774]).bindPopup('Eldham').addTo(map)
  var gritta = L.marker([-20.453393, 3.514838]).bindPopup('Gritta').addTo(map)  
    </script>
  </body>
</html>
